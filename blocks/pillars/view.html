<section class="pillars hairline-x">
  <div class="container container-wide">
    <div class="pillars__grid" data-grid="3">
      <div class="pillars__cell pillars__cell--01">
        <div class="pillars__head">
          <span class="pillars__num">01 / 03</span>
          <span class="pillars__chip"></span>
        </div>
        <h3>{{.p1_title}}</h3>
        <p class="pillars__body">{{.p1_body}}</p>
        <pre class="pillars__code">{{.p1_code}}</pre>
      </div>
      <div class="pillars__cell pillars__cell--02">
        <div class="pillars__head">
          <span class="pillars__num">02 / 03</span>
          <span class="pillars__chip"></span>
        </div>
        <h3>{{.p2_title}}</h3>
        <p class="pillars__body">{{.p2_body}}</p>
        <pre class="pillars__code">{{.p2_code}}</pre>
      </div>
      <div class="pillars__cell pillars__cell--03">
        <div class="pillars__head">
          <span class="pillars__num">03 / 03</span>
          <span class="pillars__chip"></span>
        </div>
        <h3>{{.p3_title}}</h3>
        <p class="pillars__body">{{.p3_body}}</p>
        <pre class="pillars__code">{{.p3_code}}</pre>
      </div>
    </div>
  </div>
</section>
