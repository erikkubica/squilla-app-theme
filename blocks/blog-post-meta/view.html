<section class="post-meta">
  <div class="container container-narrow">
    <a href="/blog" class="post-meta__back">← back to blog</a>
    <div class="post-meta__strip">
      <span>{{.date}}</span>
      <span class="post-meta__sep">│</span>
      <span class="tag post-meta__tag" data-color="{{.color}}">{{.tag}}</span>
      <span class="post-meta__sep">│</span>
      <span>{{.read}}</span>
      <span class="post-meta__sep">│</span>
      <span>{{.author}}</span>
    </div>
  </div>
</section>
