<section class="gtabs" data-squilla-gtabs>
  <div class="container container-wide">
    {{ with .eyebrow }}<div class="h-eyebrow">{{.}}</div>{{ end }}
    {{ with .title }}<h2 class="gtabs__title">{{.}}</h2>{{ end }}

    <div class="gtabs__tabs" role="tablist">
      {{ range $i, $t := .tabs }}
        <button type="button" class="gtabs__tab" role="tab" data-tab="{{$t.slug}}"{{ if eq $i 0 }} aria-selected="true"{{ end }}>{{$t.label}}</button>
      {{ end }}
    </div>

    <div class="gtabs__panels">
      {{ range $i, $t := .tabs }}
        <div class="gtabs__panel" data-panel="{{$t.slug}}"{{ if ne $i 0 }} hidden{{ end }}>
          <div class="gtabs__grid">
            {{ range $t.images }}
              {{ if .image.url }}
                <img class="gtabs__img" src="{{ .image.url }}" alt="{{ or .alt .image.alt }}" loading="lazy">
              {{ else }}
                <div class="gtabs__img gtabs__img--ph" role="img" aria-label="placeholder image">
                  <span>image</span>
                </div>
              {{ end }}
            {{ end }}
          </div>
          {{ with $t.caption }}<div class="gtabs__caption">{{ safeHTML . }}</div>{{ end }}
        </div>
      {{ end }}
    </div>
  </div>
</section>
