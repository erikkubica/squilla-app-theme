<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Squilla — The CMS where AI does the work.</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Inter+Tight:wght@400;500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="styles.css" />
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>

<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="brand.jsx"></script>
<script type="text/babel" src="chrome.jsx"></script>
<script type="text/babel" src="home-hero.jsx"></script>
<script type="text/babel" src="home-mcp.jsx"></script>
<script type="text/babel" src="home-rest.jsx"></script>
<script type="text/babel" src="pages-1.jsx"></script>
<script type="text/babel" src="pages-2.jsx"></script>
<script type="text/babel" src="pages-docs.jsx"></script>
<script type="text/babel" src="pages-extra.jsx"></script>

<script type="text/babel">
const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "theme": "dark",
  "accent": "violet",
  "density": "normal",
  "motif": "subtle",
  "hero": "ai"
}/*EDITMODE-END*/;

const App = () => {
  const [tweaks, setTweak] = useTweaks(TWEAK_DEFAULTS);
  const [page, setPage] = React.useState('home');

  React.useEffect(() => {
    document.documentElement.setAttribute('data-theme', tweaks.theme);
    document.documentElement.setAttribute('data-accent', tweaks.accent);
    document.documentElement.setAttribute('data-density', tweaks.density);
  }, [tweaks.theme, tweaks.accent, tweaks.density]);

  React.useEffect(() => { window.scrollTo(0, 0); }, [page]);

  const Page = () => {
    switch (page) {
      case 'home': return (
        <>
          <Hero variant={tweaks.hero} motif={tweaks.motif} />
          <Pillars />
          <ArchDiagram />
          <McpConsole />
          <ExtensionsGrid />
          <ThemeSection />
          <PerfSection />
          <FooterCTA />
        </>
      );
      case 'features': return <FeaturesPage />;
      case 'arch':     return <ArchitecturePage />;
      case 'ext':      return <ExtensionsPage />;
      case 'themes':   return <ThemesPage />;
      case 'docs':     return <DocsPage />;
      case 'about':    return <AboutPage />;
      case 'blog':     return <BlogPage setPage={setPage} />;
      case 'post':     return <BlogPostPage setPage={setPage} />;
      case 'showcase': return <ShowcasePage />;
      case 'pricing':  return <PricingPage />;
      case 'legal':    return <LegalPage />;
      case '404':      return <NotFoundPage setPage={setPage} />;
      default: return <NotFoundPage setPage={setPage} />;
    }
  };

  return (
    <div className="page" data-screen-label={"Page · " + page}>
      <TopNav page={page} setPage={setPage} />
      <Page />
      {page !== 'never' && <SiteFooter setPage={setPage} />}

      <TweaksPanel title="Tweaks">
        <TweakSection title="Theme">
          <TweakRadio
            value={tweaks.theme}
            onChange={v => setTweak('theme', v)}
            options={[{ value: 'dark', label: 'Dark' }, { value: 'light', label: 'Light' }]}
          />
        </TweakSection>

        <TweakSection title="Accent">
          <TweakRadio
            value={tweaks.accent}
            onChange={v => setTweak('accent', v)}
            options={[
              { value: 'teal',    label: 'Teal' },
              { value: 'coral',   label: 'Coral' },
              { value: 'lime',    label: 'Lime' },
              { value: 'magenta', label: 'Magenta' },
              { value: 'violet',  label: 'Violet' },
            ]}
          />
        </TweakSection>

        <TweakSection title="Density">
          <TweakRadio
            value={tweaks.density}
            onChange={v => setTweak('density', v)}
            options={[
              { value: 'compact',  label: 'Compact' },
              { value: 'normal',   label: 'Normal' },
              { value: 'spacious', label: 'Spacious' },
            ]}
          />
        </TweakSection>

        <TweakSection title="Mantis-shrimp motif">
          <TweakRadio
            value={tweaks.motif}
            onChange={v => setTweak('motif', v)}
            options={[
              { value: 'heavy',  label: 'Heavy' },
              { value: 'subtle', label: 'Subtle' },
              { value: 'none',   label: 'None' },
            ]}
          />
        </TweakSection>

        <TweakSection title="Hero copy">
          <TweakRadio
            value={tweaks.hero}
            onChange={v => setTweak('hero', v)}
            options={[
              { value: 'ai',     label: 'AI' },
              { value: 'speed',  label: 'Speed' },
              { value: 'kernel', label: 'Kernel' },
            ]}
          />
        </TweakSection>

        <TweakSection title="Jump to page">
          <TweakSelect
            value={page}
            onChange={v => setPage(v)}
            options={NAV.map(n => ({ value: n.id, label: n.label }))}
          />
        </TweakSection>
      </TweaksPanel>
    </div>
  );
};

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
